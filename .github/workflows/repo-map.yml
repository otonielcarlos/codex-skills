name: Repo Map

on:
  push:
    paths: ["repo-map/**", ".github/workflows/repo-map.yml"]
  pull_request:
    paths: ["repo-map/**", ".github/workflows/repo-map.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python }}
      - name: Test extraction, CLI and token comparison
        run: uv run --locked --project repo-map python -m unittest discover -s repo-map/tests -v
